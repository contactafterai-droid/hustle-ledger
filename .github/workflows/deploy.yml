name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily rebuild so the countdown stays current
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (fails on unsourced or malformed data)
        run: python build.py
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "hustle-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
